<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>朴里节头像框</title>
  <style>
    :root { color-scheme: light; --page:#edf1e9; --card:rgba(255,255,255,.66); --panel:rgba(255,255,255,.45); --ink:#1a2e1f; --muted:#708073; --line:rgba(61,79,63,.12); --accent:#6b4eff; --accent-strong:#5739e8; --shadow:0 18px 55px rgba(37,58,42,.11); }
    :root[data-theme="dark"] { color-scheme: dark; --page:#15141b; --card:rgba(42,39,51,.9); --panel:rgba(255,255,255,.06); --ink:#f2eff8; --muted:#b6b0c1; --line:rgba(255,255,255,.12); --accent:#ad9bff; --accent-strong:#c2b5ff; --shadow:0 22px 65px rgba(0,0,0,.28); }
    * { box-sizing:border-box; } body { min-width:320px; min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(circle at 8% 4%,rgba(132,108,255,.18),transparent 32%),radial-gradient(circle at 88% 93%,rgba(132,190,145,.16),transparent 34%),var(--page); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .page { width:min(1040px,100%); margin:0 auto; padding:36px 24px 48px; }.top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }.eyebrow { margin:0 0 7px; color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.16em; }.top h1 { margin:0; font-family:Georgia,"Songti SC",serif; font-size:clamp(28px,4vw,42px); font-weight:500; letter-spacing:-.04em; }.theme-button { width:38px; height:38px; border:1px solid var(--line); border-radius:11px; display:grid; place-items:center; color:var(--muted); background:var(--panel); cursor:pointer; font-size:17px; }.theme-button:hover,.theme-button:focus-visible { color:var(--accent); border-color:var(--accent); outline:none; }
    .shell { padding:18px; border:1px solid var(--line); border-radius:28px; display:grid; grid-template-columns:minmax(0,520px) minmax(250px,1fr); gap:36px; background:var(--card); box-shadow:var(--shadow); backdrop-filter:blur(18px); }.editor { min-width:0; }.canvas-wrap { position:relative; overflow:hidden; border-radius:18px; background:rgba(103,83,170,.08); }.canvas-wrap canvas { width:100%; display:block; aspect-ratio:1; touch-action:none; }.upload-overlay { position:absolute; inset:0; display:grid; place-items:center; }.upload-overlay[hidden] { display:none; }.upload { min-width:160px; height:50px; padding:0 18px; border:0; border-radius:13px; background:var(--accent); color:white; box-shadow:0 8px 20px rgba(107,78,255,.28); font-size:15px; font-weight:750; cursor:pointer; }.upload:hover,.upload:focus-visible { background:var(--accent-strong); outline:2px solid var(--accent); outline-offset:3px; }.controls { margin-top:16px; padding:15px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }.controls[hidden] { display:none; }.control-title { margin:0 0 3px; font-size:14px; font-weight:750; }.control-help { margin:0 0 14px; color:var(--muted); font-size:12px; line-height:1.45; }.zoom-row { display:grid; grid-template-columns:35px 1fr 35px; align-items:center; gap:8px; }.zoom-row button { width:35px; height:35px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:19px; cursor:pointer; }.zoom-row button:hover,.zoom-row button:focus-visible { color:var(--accent); border-color:var(--accent); outline:none; }.zoom-row input { width:100%; accent-color:var(--accent); cursor:pointer; }.control-footer { margin-top:12px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; }.text-button { border:0; padding:0; background:transparent; color:var(--accent); font:inherit; cursor:pointer; }.text-button:hover,.text-button:focus-visible { text-decoration:underline; outline:none; }
    .download { width:100%; height:50px; margin-top:16px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-size:15px; font-weight:750; cursor:pointer; }.download:hover:not(:disabled),.download:focus-visible:not(:disabled) { background:var(--accent-strong); outline:2px solid var(--accent); outline-offset:3px; }.download:disabled { opacity:.42; cursor:not-allowed; }.info { align-self:center; padding:10px 8px; }.info h2 { margin:0 0 10px; font-family:Georgia,"Songti SC",serif; font-size:28px; font-weight:500; }.info p { max-width:330px; margin:0; color:var(--muted); font-size:14px; line-height:1.75; }.info ul { margin:23px 0 0; padding:0; display:grid; gap:13px; list-style:none; }.info li { position:relative; padding-left:20px; font-size:13px; line-height:1.5; }.info li::before { content:""; position:absolute; left:0; top:.45em; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent); }.notice { min-height:20px; margin:12px 0 0; color:#b44950; font-size:12px; line-height:1.5; }.notice:empty { display:none; }.footer { margin:20px 0 0; color:var(--muted); font-size:12px; text-align:center; }
    @media (max-width:760px) { .page { padding:22px 14px 32px; }.top { margin-bottom:20px; }.shell { grid-template-columns:1fr; gap:20px; padding:12px; border-radius:22px; }.info { padding:4px 5px 8px; }.info h2 { font-size:24px; }.info ul { margin-top:16px; }.controls { padding:13px; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="top"><div><p class="eyebrow">PLEASE DAY</p><h1>朴里节头像框</h1></div><button class="theme-button" id="themeButton" type="button" aria-label="切换深色模式" title="切换显示模式">◐</button></header>
    <main class="shell">
      <section class="editor" aria-label="头像编辑器">
        <div class="canvas-wrap"><canvas id="canvas" width="850" height="850" aria-label="头像预览"></canvas><div class="upload-overlay" id="uploadOverlay"><button class="upload" id="uploadButton" type="button">上传头像</button></div></div>
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
        <div class="controls" id="controls" hidden><p class="control-title">缩放与定位</p><p class="control-help">拖动图片调整位置，滑动调节大小。</p><div class="zoom-row"><button id="zoomOut" type="button" aria-label="缩小头像">−</button><input id="zoom" type="range" min="0.7" max="3.5" step="0.01" value="1" aria-label="头像缩放" /><button id="zoomIn" type="button" aria-label="放大头像">＋</button></div><div class="control-footer"><span id="zoomValue">100%</span><button id="resetButton" class="text-button" type="button">还原位置</button></div></div>
        <button class="download" id="downloadButton" type="button" disabled>下载头像</button><p class="notice" id="notice" role="alert"></p>
      </section>
      <aside class="info"><h2>操作步骤</h2><p>简单三步，生成你的朴里节专属头像。</p><ul><li>点击“上传头像”，选择一张本地照片</li><li>拖动照片调整位置，用滑杆调整大小</li><li>点击“下载头像”，保存高清 PNG 图片</li></ul></aside>
    </main>
    <p class="footer">朴里节头像工具 · 离线版</p>
  </div>

      let avatar = null;
      let avatarUrl = '';
      let zoom = 1;
      let offset = { x: 0, y: 0 };
      let drag = null;

      function message(text = '') { notice.textContent = text; }
      function draw() {
        if (!frame.complete || !frame.naturalWidth) return;
        context.clearRect(0, 0, OUTPUT, OUTPUT);
        if (avatar) {
          const baseScale = Math.max(OUTPUT / avatar.naturalWidth, OUTPUT / avatar.naturalHeight);
          const width = avatar.naturalWidth * baseScale * zoom;
          const height = avatar.naturalHeight * baseScale * zoom;
          context.drawImage(avatar, (OUTPUT - width) / 2 + offset.x, (OUTPUT - height) / 2 + offset.y, width, height);
        }
        context.drawImage(frame, 0, 0, OUTPUT, OUTPUT);
      }
      function setZoom(value) { zoom = Math.max(.7, Math.min(3.5, value)); zoomInput.value = zoom; zoomValue.textContent = `${Math.round(zoom * 100)}%`; draw(); }
      function reset() { offset = { x: 0, y: 0 }; setZoom(1); }
      function loadAvatar(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) return message('请选择 PNG、JPG 或 WebP 图片。');
        message();
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => { if (avatarUrl) URL.revokeObjectURL(avatarUrl); avatarUrl = url; avatar = image; reset(); uploadOverlay.hidden = true; controls.hidden = false; downloadButton.disabled = false; };
        image.onerror = () => { URL.revokeObjectURL(url); message('图片无法读取，请换一张图片重试。'); };
        image.src = url;
      }
      frame.onload = draw;
      frame.onerror = () => message('头像框资源缺失，请确认压缩包中的图片文件未被移动或删除。');
      uploadButton.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (event) => { loadAvatar(event.target.files[0]); event.target.value = ''; });
      zoomInput.addEventListener('input', (event) => setZoom(Number(event.target.value)));
      document.querySelector('#zoomOut').addEventListener('click', () => setZoom(zoom - .1));
      document.querySelector('#zoomIn').addEventListener('click', () => setZoom(zoom + .1));
      document.querySelector('#resetButton').addEventListener('click', reset);
      canvas.addEventListener('pointerdown', (event) => { if (!avatar) return; canvas.setPointerCapture(event.pointerId); drag = { id:event.pointerId, x:event.clientX, y:event.clientY, offset:{ ...offset } }; });
      canvas.addEventListener('pointermove', (event) => { if (!drag || !avatar) return; const rect = canvas.getBoundingClientRect(); const scale = OUTPUT / rect.width; offset = { x:drag.offset.x + (event.clientX - drag.x) * scale, y:drag.offset.y + (event.clientY - drag.y) * scale }; draw(); });
      function stopDrag(event) { if (!drag) return; try { canvas.releasePointerCapture(drag.id); } catch {} drag = null; }
      canvas.addEventListener('pointerup', stopDrag); canvas.addEventListener('pointercancel', stopDrag);
      canvas.addEventListener('wheel', (event) => { if (!avatar) return; event.preventDefault(); setZoom(zoom - event.deltaY * .001); }, { passive:false });
      downloadButton.addEventListener('click', () => { try { const link = document.createElement('a'); link.href = canvas.toDataURL('image/png'); link.download = '朴里节头像.png'; link.target = '_blank'; link.rel = 'noopener'; document.body.appendChild(link); link.click(); link.remove(); message('已生成头像。若浏览器未自动下载，请在新打开的图片页长按或右键另存。'); } catch { message('图片导出失败，请重试。'); } });
      const root = document.documentElement;
      const themeButton = document.querySelector('#themeButton');
      function setTheme(theme) { root.dataset.theme = theme; themeButton.setAttribute('aria-label', theme === 'dark' ? '切换浅色模式' : '切换深色模式'); localStorage.setItem('please-day-offline-theme', theme); }
      setTheme(localStorage.getItem('please-day-offline-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      themeButton.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
      addEventListener('beforeunload', () => { if (avatarUrl) URL.revokeObjectURL(avatarUrl); });
    })();
  </script>
