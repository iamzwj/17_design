name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 17design-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: 49.235.121.231
      SERVER_USER: ubuntu
      SERVER_APP_DIR: /home/ubuntu/17_design
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Build server environment
        run: |
          umask 077
          {
            printf '%s\n' 'PORT=8787'
            printf '%s\n' 'DIEFA_DATA_DIR=/home/ubuntu/17_design/data'
            printf '%s\n' "GRSAI_BASE_URL=${{ secrets.GRSAI_BASE_URL }}"
            printf '%s\n' "GRSAI_API_KEY=${{ secrets.GRSAI_API_KEY }}"
            printf '%s\n' "VIBBIT_OPENAPI_KEY=${{ secrets.VIBBIT_OPENAPI_KEY }}"
            printf '%s\n' "VIBBIT_OPENAPI_BASE_URL=${{ secrets.VIBBIT_OPENAPI_BASE_URL }}"
            printf '%s\n' 'VIBBIT_PUBLIC_BASE_URL=https://app.17design.fun'
            printf '%s\n' "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"
            printf '%s\n' "SMTP_HOST=${{ secrets.SMTP_HOST }}"
            printf '%s\n' "SMTP_PORT=${{ secrets.SMTP_PORT }}"
            printf '%s\n' "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}"
            printf '%s\n' "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}"
            printf '%s\n' 'SMTP_HELO=onewo.com'
          } > .deployment.env

      - name: Upload server environment
        run: |
          scp -i ~/.ssh/id_ed25519 .deployment.env "$SERVER_USER@$SERVER_HOST:$SERVER_APP_DIR/.env.next"

      - name: Update application and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" <<'REMOTE'
            set -euo pipefail
            cd /home/ubuntu/17_design
            mkdir -p data
            previous_revision=$(git rev-parse HEAD)
            GIT_SSH_COMMAND='ssh -i /home/ubuntu/.ssh/17design_server -o IdentitiesOnly=yes' git pull --ff-only origin main

            # A UI-only deployment must not briefly take the whole site offline.
            # Restart Node only when its runtime files or configuration changed.
            restart_required=0
            if ! git diff --quiet "$previous_revision" HEAD -- server package.json package-lock.json; then
              restart_required=1
            fi
            if ! cmp -s .env .env.next 2>/dev/null; then
              restart_required=1
            fi
            install -m 600 .env.next .env
            rm .env.next
            npm ci
            npm run build

            # Emergency rollback for the first static-site attempt. The app
            # directory is not readable by the Nginx worker on this server.
            # Restore the timestamped config backup before serving traffic.
            nginx_site=/etc/nginx/sites-available/app.17design.fun
            if sudo grep -q '17design-static-shell' "$nginx_site"; then
              backup_site=$(sudo find /etc/nginx/sites-available -maxdepth 1 -type f -name 'app.17design.fun.before-static-*' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
              test -n "$backup_site"
              sudo cp "$backup_site" "$nginx_site"
              sudo nginx -t
              sudo systemctl reload nginx
            fi

            if [ "$restart_required" -eq 1 ]; then
              sudo systemctl restart 17design
              sleep 2
            else
              echo 'Static-only deployment: keeping 17design.service running.'
            fi
            sudo systemctl is-active --quiet 17design
          REMOTE
