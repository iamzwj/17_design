name: Actual film test monitor
on:
  push:
    branches: [diagnostic/model-probe]
permissions:
  contents: read
jobs:
  probe:
    if: "startsWith(github.event.head_commit.message, 'Monitor')"
    runs-on: ubuntu-latest
    steps:
      - name: Probe production model channel
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/probe
          chmod 600 ~/.ssh/probe
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/probe ubuntu@49.235.121.231 'cd /home/ubuntu/17_design && node --env-file=.env --input-type=module' <<'JS'
          import fs from 'node:fs';import path from 'node:path';
          const dir='/home/ubuntu/17_design/data/diagnostics/image25-actual';
          const base=(process.env.GRSAI_BASE_URL||'https://grsaiapi.com').replace(/\/$/,'');
          const safe=e=>{const s=typeof e==='string'?e:JSON.stringify(e||'');return [...new Set((s.match(/timeout|timed out|rate limit|too many requests|concurrency|download|fetch failed|403|expired|invalid image|image size|content policy|safety|超时|下载失败|参考图|并发/gi)||[]).map(x=>x.toLowerCase()))]};
          if(fs.existsSync(dir))for(const file of fs.readdirSync(dir).filter(f=>f.endsWith('.json'))){const x=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));console.log(JSON.stringify({phase:'probe_snapshot',label:x.label,ageSeconds:Math.round((Date.now()-x.startedAt)/1000),status:x.result?.status,submissionAccepted:!!x.providerId,errorTerms:safe(x.result?.error||x.error),refs:x.requestBody?.images?.length}));}
          const root='/home/ubuntu/17_design/data/films';let pending=0;const stats={};
          for(const id of fs.readdirSync(root).filter(x=>/^[a-f0-9-]{36}$/.test(x))){let p;try{p=JSON.parse(fs.readFileSync(path.join(root,id,'project.json'),'utf8'))}catch{continue;}for(const t of p.tasks||[]){if(t.kind!=='frame')continue;if(t.status==='running')pending++;if(t.requestBody?.model!=='gpt-image-2.5'&&t.model!=='gpt-image-2.5')continue;const key=(t.requestBody?.images?.length||0)+'refs_'+t.status;stats[key]=(stats[key]||0)+1;if(p.shots?.length!==10||t.status!=='failed')continue;let upstream;const taskId=t.providerId||t.failedProviderId;if(taskId)try{const r=await fetch(base+'/v1/api/result?id='+encodeURIComponent(taskId),{headers:{Authorization:'Bearer '+process.env.GRSAI_API_KEY},signal:AbortSignal.timeout(12000)});const raw=await r.json(),d=raw.data||raw;upstream={http:r.status,status:d.status,errorTerms:safe(d.error),errorKeys:typeof d.error==='object'&&d.error?Object.keys(d.error):[]};}catch(e){upstream={queryError:e.name}}console.log(JSON.stringify({phase:'original_failure',refs:t.requestBody?.images?.length,localTerms:safe(t.error),upstream}));}}
          console.log(JSON.stringify({phase:'aggregate',runningFrameTasks:pending,stats}));
          JS
