name: Test GRSAI language models
on:
  push:
    branches: [test/grsai-language-models]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe language model availability
        env:
          API_KEY: ${{ secrets.GRSAI_API_KEY }}
          BASE_URL: ${{ secrets.GRSAI_BASE_URL }}
        run: |
          python3 -u - <<'PY'
          import os,json,time,urllib.request,urllib.error,concurrent.futures
          key=os.environ['API_KEY']; base=(os.environ.get('BASE_URL') or 'https://grsaiapi.com').rstrip('/')
          if base.endswith('/v1'): base=base[:-3]
          def call(path,body=None):
              start=time.monotonic()
              req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body else None,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=65) as r: data=json.load(r)
                  return {'seconds':round(time.monotonic()-start,2),'data':data}
              except Exception as e:
                  detail=e.read().decode()[:600] if isinstance(e,urllib.error.HTTPError) else str(e)
                  return {'seconds':round(time.monotonic()-start,2),'error':detail.replace(key,'[REDACTED]')}
          import struct,zlib,base64
          w,h=256,128
          rows=b''.join(b'\x00'+b''.join(bytes((230,30,30) if x<128 else (30,60,230)) for x in range(w)) for y in range(h))
          def chunk(k,d):return struct.pack('>I',len(d))+k+d+struct.pack('>I',zlib.crc32(k+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(rows))+chunk(b'IEND',b'')
          uri='data:image/png;base64,'+base64.b64encode(png).decode()
          def probe(model):
              r=call('/v1/chat/completions',{'model':model,'response_format':{'type':'json_object'},'messages':[{'role':'user','content':[{'type':'text','text':'根据图片判断左右两半的颜色。只输出JSON，包含status(pass或review)、confidence(high或low)、summary(写出左侧和右侧实际颜色)。'},{'type':'image_url','image_url':{'url':uri}}]}]})
              print('VISION',model,json.dumps(r,ensure_ascii=False).replace(key,'[REDACTED]'),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(probe,['gpt-6.1-sol','gemini-3.1-pro','gpt-6.1-terra','gpt-5.6-sol','gpt-5.6-terra','gemini-3.8-flash']))
          PY
