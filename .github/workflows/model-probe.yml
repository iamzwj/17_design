name: Anonymous film queue diagnosis
on:
  push:
    branches: [diagnostic/model-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production model channel
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/probe
          chmod 600 ~/.ssh/probe
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/probe ubuntu@49.235.121.231 'cd /home/ubuntu/17_design && node --env-file=.env --input-type=module' <<'JS'
          const fs=await import('node:fs');
          const root='/home/ubuntu/17_design/data/films';
          for(const id of fs.readdirSync(root).filter(x=>/^[a-f0-9-]{36}$/.test(x))) {
            let p;try{p=JSON.parse(fs.readFileSync(root+'/'+id+'/project.json','utf8'));}catch{continue;}
            if(!p.shots?.some(s=>!s.frame)||!['running','queued','failed','needs-input'].includes(p.status))continue;
            console.log(JSON.stringify({model:p.imageModel,status:p.status,frames:p.shots.filter(s=>s.frame).length,total:p.shots.length}));
            for(const t of (p.tasks||[]).filter(t=>t.kind==='frame'&&['running','failed','needs-input'].includes(t.status))) {
              let upstream;
              if(t.providerId)try {
                const r=await fetch((process.env.GRSAI_BASE_URL||'https://grsaiapi.com').replace(/\/$/,'')+'/v1/api/result?id='+encodeURIComponent(t.providerId),{headers:{Authorization:'Bearer '+process.env.GRSAI_API_KEY},signal:AbortSignal.timeout(12000)});
                const d=await r.json();upstream={http:r.status,status:d.status,category: /rate.?limit|429|concurr|too many/i.test(JSON.stringify(d.error||''))?'rate_limit':/timeout/i.test(JSON.stringify(d.error||''))?'timeout':/image|reference|url|download/i.test(JSON.stringify(d.error||''))?'reference':d.error?'other':null};
              }catch(e){upstream={error:e.name};}
              const refs=t.requestBody?.images||[];
              const referenceSizes=refs.map(url=>{
                try {const file=new URL(url).pathname.split('/').pop();return fs.statSync(root+'/'+id+'/'+file).size;}catch{return null;}
              });
              console.log(JSON.stringify({status:t.status,providerStatus:t.providerStatus,referenceCount:refs.length,referenceSizes,promptCharacters:t.requestBody?.prompt?.length,localErrorCategory:/rate.?limit|429|concurr|too many/i.test(t.error||'')?'rate_limit':/timeout|超时/i.test(t.error||'')?'timeout':t.error?'other':null,upstream}));

            }
          }
          JS
