name: Language model probe
on:
  push:
    branches: [diagnostic/model-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production model channel
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/probe
          chmod 600 ~/.ssh/probe
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/probe ubuntu@49.235.121.231 'cd /home/ubuntu/17_design && node --env-file=.env --input-type=module' <<'JS'
          const models=['gpt-5.6-terra','gemini-3.1-pro','gpt-6-astra','gpt-5.5'];
          for(let round=1;round<=2;round++) {
            for(const model of models) {
              const start=performance.now();
              let first=null, output='', status=0;
              try {
                const r=await fetch((process.env.GRSAI_BASE_URL||'https://grsaiapi.com').replace(/\/$/,'')+'/v1/chat/completions',{
                  method:'POST',
                  headers:{Authorization:'Bearer '+process.env.GRSAI_API_KEY,'Content-Type':'application/json'},
                  body:JSON.stringify({model,stream:true,messages:[{role:'user',content:'请只回复：模型连接测试成功。'}]}),
                  signal:AbortSignal.timeout(45000)
                });
                status=r.status;
                if(!r.ok) throw Error('HTTP '+status);
                const reader=r.body.getReader(), decoder=new TextDecoder();
                let pending='';
                while(true) {
                  const {done,value}=await reader.read(); if(done)break;
                  pending+=decoder.decode(value,{stream:true});
                  const lines=pending.split('\n');pending=lines.pop();
                  for(const line of lines) {
                    if(!line.startsWith('data:'))continue;
                    try {
                      const data=JSON.parse(line.slice(5).trim());
                      const chunk=data.choices?.[0]?.delta?.content;
                      if(chunk){first??=(performance.now()-start)/1000;output+=chunk;}
                    }catch{}
                  }
                }
                console.log(JSON.stringify({round,model,status,firstContentSeconds:first,totalSeconds:+((performance.now()-start)/1000).toFixed(2),ok:output.includes('测试成功'),characters:output.length}));
              } catch(error) {
                console.log(JSON.stringify({round,model,status,ok:false,totalSeconds:+((performance.now()-start)/1000).toFixed(2),error:error.name}));
              }
            }
          }
          JS
