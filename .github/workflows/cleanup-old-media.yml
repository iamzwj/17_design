name: Clean media older than 15 days
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts
      - name: Remove expired media and report disk space
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@49.235.121.231 python3 - <<'PY'
          import os, pathlib, time, json
          root = pathlib.Path('/home/ubuntu/17_design/data')
          cutoff = time.time() - 15 * 86400
          extensions = {'.png','.jpg','.jpeg','.webp','.gif','.avif','.mp4','.mov','.webm','.mkv','.avi','.m4v','.mp3','.wav','.m4a','.aac','.ogg'}
          protected = set()
          for project in (root/'films').glob('*/project.json'):
              try:
                  p = json.loads(project.read_text())
                  if p.get('status') in {'running','queued','pausing','review','needs-input'} or p.get('activeJobs'):
                      protected.add(project.parent)
              except Exception:
                  protected.add(project.parent)
          count = total = skipped = 0
          for base in [root/'films', root/'waterfall-assets', root/'video-assets']:
              if not base.exists(): continue
              for folder, dirs, files in os.walk(base, followlinks=False):
                  dirs[:] = [d for d in dirs if not (pathlib.Path(folder)/d).is_symlink()]
                  for name in files:
                      file = pathlib.Path(folder)/name
                      if file.is_symlink() or file.suffix.lower() not in extensions: continue
                      if any(p == file.parent or p in file.parents for p in protected):
                          skipped += 1
                          continue
                      try:
                          st = file.stat()
                          if st.st_mtime >= cutoff: continue
                          file.unlink()
                          count += 1
                          total += st.st_size
                      except FileNotFoundError: pass
          print(json.dumps({'cutoff_utc':time.strftime('%Y-%m-%d %H:%M:%S',time.gmtime(cutoff)), 'deleted_files':count,'freed_bytes':total,'protected_active_media':skipped}))
          os.system('df -h /home/ubuntu/17_design')
          os.system('du -h -d 1 /home/ubuntu/17_design/data 2>/dev/null | sort -h | tail -12')
          PY
      - name: Inspect remaining disk usage without deletion
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@49.235.121.231 <<'REMOTE'
            sudo du -x -h -d 1 / /home /var /tmp /root /opt 2>/dev/null | sort -h | tail -45
            du -h -d 1 /home/ubuntu /home/ubuntu/.cache /home/ubuntu/.npm /home/ubuntu/17_design 2>/dev/null | sort -h | tail -35
            sudo journalctl --disk-usage
            sudo find /var/log /tmp /home/ubuntu/.cache /home/ubuntu/.npm -xdev -type f -size +200M -printf '%s %p\n' 2>/dev/null | sort -nr | head -20
            true
          REMOTE
