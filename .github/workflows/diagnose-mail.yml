name: Send one SMTP test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts

      - name: Send the requested test email
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@49.235.121.231 python3 - <<'PYREMOTE'
          import pathlib, smtplib, ssl
          from email.message import EmailMessage
          config={}
          for line in pathlib.Path('/home/ubuntu/17_design/.env').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); config[k]=v.strip().strip('"').strip("'")
          stage='connect'
          try:
              client=smtplib.SMTP_SSL(config['SMTP_HOST'],int(config.get('SMTP_PORT','465')),timeout=20,context=ssl.create_default_context(),local_hostname=config.get('SMTP_HELO','onewo.com'))
              stage='AUTH'
              client.login(config['SMTP_USERNAME'],config['SMTP_PASSWORD'])
              msg=EmailMessage()
              msg['From']=config['SMTP_USERNAME']
              msg['To']='289849464@qq.com'
              msg['Subject']='D-Gen SMTP test'
              msg.set_content('666')
              stage='send'
              client.send_message(msg)
              print('SMTP accepted the test email')
              client.close()
          except smtplib.SMTPResponseException as e:
              print(f'SMTP rejected at {stage}: {e.smtp_code}')
              raise SystemExit(1)
          except Exception as e:
              print(f'Test failed at {stage}: {type(e).__name__}')
              raise SystemExit(1)
          PYREMOTE
