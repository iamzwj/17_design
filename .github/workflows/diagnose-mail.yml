name: Inspect SMTP failures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts

      - name: Inspect registration response counts
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@49.235.121.231 <<'REMOTE'
          sudo journalctl -u 17design --since '40 minutes ago' --no-pager | grep -E 'registration-smtp-rejected|邮件服务器拒绝|验证码邮件|SMTP 连接超时' | tail -20 || true
          sudo tail -n 5000 /var/log/nginx/access.log | awk '$7=="/api/auth/register/code" {print substr($4,2),$9}' | tail -30
          REMOTE
