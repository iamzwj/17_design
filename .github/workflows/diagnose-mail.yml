name: Diagnose registration mail without sending
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts
      - name: Check SMTP stages without sending a message
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@49.235.121.231 python3 - <<'PYREMOTE'
          import pathlib, smtplib, ssl, json
          config={}
          for line in pathlib.Path('/home/ubuntu/17_design/.env').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); config[k]=v.strip().strip('"').strip("'")

          host=config.get('SMTP_HOST','')
          port=int(config.get('SMTP_PORT') or '465')
          username=config.get('SMTP_USERNAME','')
          password=config.get('SMTP_PASSWORD','')
          print('SMTP config:', json.dumps({'host_is_163':host=='smtp.163.com','port':port,'sender_domain':username.rsplit('@',1)[-1] if '@' in username else None,'authorization_present':bool(password),'authorization_has_whitespace':any(c.isspace() for c in password)}))
          for helo,mechanism in [('onewo.com','LOGIN'),('localhost','LOGIN'),('localhost','PLAIN')]:
              stage='connect'
              try:
                  with smtplib.SMTP_SSL(host,port,timeout=12,context=ssl.create_default_context(),local_hostname=helo) as c:
                      stage='EHLO'; c.ehlo()
                      stage='AUTH'; c.user=username; c.password=password
                      code,_=c.auth(mechanism, c.auth_login if mechanism=='LOGIN' else c.auth_plain, initial_response_ok=False)
                      print(helo,mechanism,stage,code)
                      break
              except smtplib.SMTPResponseException as e:
                  print(helo,mechanism,stage,e.smtp_code,e.smtp_error==b'User has no permission')
              except Exception as e:
                  print(helo,mechanism,stage,type(e).__name__)
          PYREMOTE
