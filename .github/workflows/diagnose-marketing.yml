name: Diagnose marketing documents
on:
  push:
    branches: [test/marketing-diagnosis]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read marketing import state
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          MARKETING_KEY: ${{ secrets.MARKETING_KNOWLEDGE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 49.235.121.231 >> ~/.ssh/known_hosts
          if [ -n "$MARKETING_KEY" ]; then echo IMPORT_SECRET_PRESENT; else echo IMPORT_SECRET_MISSING; fi
          ssh ubuntu@49.235.121.231 python3 - <<'PY'
          import sqlite3,json,pathlib
          root=pathlib.Path('/home/ubuntu/17_design/data/films')
          files=sorted(root.glob('*/project.json'),key=lambda f:f.stat().st_mtime,reverse=True)
          for index,f in enumerate(files[:8]):
              p=json.loads(f.read_text());shots=p.get('shots',[])
              print('PROJECT_STATS',json.dumps({'recencyRank':index+1,'shots':len(shots),'targetDuration':p.get('duration'),'autoDuration':p.get('autoDuration'),'scriptScenes':len((p.get('script') or {}).get('scenes',[])),'totalShotSeconds':sum(s.get('duration',0) for s in shots),'durations':[s.get('duration') for s in shots],'splitCount':sum(bool(s.get('splitFrom')) for s in shots),'dialogueLengths':[len(s.get('dialogue') or '') for s in shots],'uniqueActions':len(set(s.get('action','') for s in shots))},ensure_ascii=False))
                    PY
          ssh ubuntu@49.235.121.231 'journalctl -u 17design.service -n 1500 --no-pager | grep -i "Marketing knowledge" | tail -8' || true
