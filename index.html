<!doctype html>
<html lang="zh-CN" data-theme-selection="disabled">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131217" />
    <meta name="application-name" content="D-Gen" />
    <meta name="apple-mobile-web-app-title" content="D-Gen" />
    <link rel="manifest" href="/site.webmanifest?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/dgen-d-app-192-v1.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/dgen-d-app-512-v1.png" />
    <link rel="apple-touch-icon" href="/dgen-d-app-192-v1.png" />
    <link rel="preload" as="image" href="/dgen-d-mark-v1.png" fetchpriority="high" />
    <script>
      const displayModeRoot = document.documentElement
      const useLightTheme = displayModeRoot.dataset.themeSelection === 'enabled'
        && localStorage.getItem('diefa-display-mode-v1') === 'light'
      displayModeRoot.dataset.theme = useLightTheme ? 'light' : 'dark'
      displayModeRoot.style.colorScheme = displayModeRoot.dataset.theme
    </script>
    <title>D-Gen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
